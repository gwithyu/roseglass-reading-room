name: Test and release Roseglass
on:
  push:
    branches: [main]
    paths: [RELEASE_VERSION]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify restrictive Roseglass license and release metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          license_text = read("LICENSE")
          readme = read("README.md")
          mcp_readme = read("mcp-reader/README.md")
          notices = read("THIRD_PARTY_NOTICES.md")
          pkg = json.loads(read("mcp-reader/package.json"))
          lock = json.loads(read("mcp-reader/package-lock.json"))
          version = read("RELEASE_VERSION").strip()
          assert "Personal Non-Commercial, No-Derivatives License" in license_text, "Incorrect application license"
          assert "may NOT" in license_text and "Modify, adapt" in license_text, "No-derivatives ban missing"
          assert "Sell, monetize" in license_text, "Noncommercial restriction missing"
          assert "does not retroactively revoke" in license_text, "Historical MIT caveat missing"
          assert "禁止二次修改" in readme and "商用" in readme, "README license banner missing"
          assert "no-derivatives" in mcp_readme.lower(), "MCP documentation license notice missing"
          assert "Third-party" in notices and "Apache-2.0" in notices, "Third-party notices missing"
          assert pkg.get("license") == "SEE LICENSE IN ../LICENSE", "Package license metadata mismatch"
          assert lock["packages"][""].get("license") == pkg["license"], "Lockfile license metadata mismatch"
          assert version == pkg["version"] == lock["version"] == lock["packages"][""]["version"], "Release and package versions differ"
          print("License and version checks passed:", version)
          PY
      - name: Test standalone reader
        run: node --test tests/*.test.mjs && node tests/smoke.mjs
      - name: Install MCP test dependencies
        working-directory: mcp-reader
        run: npm ci
      - name: Build and test MCP reader
        working-directory: mcp-reader
        run: npm run build && npm test && npm run validate
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish versioned source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat RELEASE_VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to overwrite."
            exit 0
          fi
          mkdir -p release-artifacts
          git archive --format=zip --prefix="roseglass-reading-room-$version/" --output="release-artifacts/roseglass-reading-room-$version.zip" HEAD
          gh release create "$tag" "release-artifacts/roseglass-reading-room-$version.zip" --target "$GITHUB_SHA" --title "Roseglass 共读室 $tag" --notes-file CHANGELOG.md --latest
